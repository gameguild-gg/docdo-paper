# =============================================================================
# queries_v2.yaml — Corrected query set (v2), docdo systematic review
# Generated: 2026-09-08 (Task 2, .omo/plans/paper-coverage-gap-update.md)
# =============================================================================
#
# CONTRACT (binding — validated by validate_queries_v2.py in this directory)
#
# 1. Six EXECUTED families: A, B, C, D, E, G — ONE executed query per family
#    per database (PubMed, arXiv, Semantic Scholar, Google Scholar).
#
# 2. Family F (CT anatomy scope) is a SHARED FRAGMENT, defined ONCE under
#    shared_fragments.family_F_anatomy and referenced by YAML alias inside
#    every A/C/D/E/G template. F is NEVER executed standalone: it has no
#    deep-learning method anchor, and a standalone F query would flood the
#    raw set with every anatomy+segmentation record.
#
# 3. Pinned conjunction template (no executor judgment):
#      A/C/D/E/G = (family terms)
#                   AND (segmentation OR "medical imaging")
#                   AND (family-F anatomy block)
#      B = (exact tool names: MONAI, Auto3DSeg, MONAI Label, MONAI Deploy,
#           VISTA-3D, NV-Segment-CT, nnInteractive, NVIDIA Clara, Holoscan)
#          OR ((framework vocabulary: open-source framework, medical imaging
#              toolkit, software framework, deployment, microservice,
#              inference pipeline, clinical workflow, PACS, DICOM,
#              reproducib*, Grand Challenge)
#              AND ("medical imaging" OR radiolog* OR tomograph*))
#      Family B is explicitly NOT ANDed with segmentation, so
#      deployment-flavored tooling papers enter the raw set.
#
# 4. Each query is a LIST of AND-blocks (strings); the executed query string
#    is " AND ".join(blocks). Template families have exactly three blocks
#    (family terms; segmentation/medical-imaging; F anatomy). Family B has
#    exactly one block (a top-level disjunction).
#
# 5. Fielded syntax: PubMed uses [tiab] (equivalent to [Title/Abstract] in
#    S3 §3.1); arXiv uses ti:/abs: pairs (S3 §3.3 precedent). The Semantic
#    Scholar Graph API relevance-search endpoint has NO fielded search, so
#    its queries keep the same boolean block structure with quoted phrases
#    and no field prefixes. Google Scholar blocks are plain quoted phrases —
#    GS ignores ti:/abs: fielded syntax.
#
# 6. Exact-token rule (family C): the bare tokens "SAM" and "SAT" appear ONLY
#    as quoted exact forms, never as bare substrings.
#
# 7. Wildcards: PubMed (Entrez) keeps radiolog*/tomograph*/reproducib*.
#    arXiv, Semantic Scholar and Google Scholar have no wildcard support —
#    those blocks expand the wildcards to explicit word forms.
#
# 8. Date range 2015-01-01 .. execution date lives in `date_range` below;
#    the fetcher applies it per database (the query blocks carry no date
#    clause). Google Scholar has NO query-level date filtering (see
#    date_range.application.google_scholar).
# =============================================================================

version: "2"
generated: "2026-09-08"
review: "Deep Learning for 3D CT Organ Segmentation — Systematic Review"
plan_reference: ".omo/plans/paper-coverage-gap-update.md (Task 2, term lists verbatim)"

# Seed-recall fix loop (Task 6, 2026-09-08) — one sanctioned revision:
#   1. Family B: added the exact token VISTA3D (all four databases; query ids
#      bumped to B-*-002). Root cause: the VISTA-3D canonical paper
#      (arXiv:2406.05285) is titled "VISTA3D: A Unified Segmentation
#      Foundation Model For 3D Medical Imaging" — no hyphen — so the pinned
#      hyphenated form cannot match it in any fielded index.
#   2. Family C arXiv only: query id bumped to C-ARX-002 with the query text
#      UNCHANGED. Root cause: the arXiv API intermittently degrades the parse
#      of this ~1.8 KB boolean query (observed totalResults 893 vs 185,098 for
#      the identical query string on 2026-09-08); the fetch-time sample missed
#      the canonical SAM-Med3D paper (arXiv:2310.15161), which ranks in the
#      top 15 under a full parse. Resample under a new immutable query id.
#   -001 CSVs are immutable and remain the artifacts of the original fetch.
revisions:
  - revision: "r1-seed-recall"
    date: "2026-09-08"
    task: "paper-coverage-gap-update Task 6 (seed recall oracle fix loop)"
    changes:
      - "family B terms += VISTA3D; B-PUB-002/B-ARX-002/B-S2-002/B-GS-002"
      - "family C arXiv query id C-ARX-001 -> C-ARX-002 (query text unchanged; arXiv API parse flakiness resample)"
  - revision: "r2-pubmed-window-remediation"
    date: "2026-09-08"
    task: "paper-coverage-gap-update Task 6 remediation (key-free)"
    changes:
      - "supplementary_queries section added (below) — executed ONCE each by the Task-6 remediation driver; NOT part of the executed_families contract and not re-run by docdo fetch-v2 run_all"
      - "fetch_v2_fetchers.fetch_pubmed_v2 gained sort= (relevance window) and fetch_pubmed_by_pmids (direct efetch) — see operations/tests/test_fetch_v2.py"

# One-shot remediation fetches (Task 6 continuation). These do NOT alter the
# six-family executed contract above; each was executed once by a targeted
# driver with provenance rows in raw/v2/_provenance.csv. Block text for
# G-PUB-002-r is loaded programmatically from executed_families.G (single
# source of truth — not duplicated here).
supplementary_queries:
  - query_id: B-PUB-002-pmid
    database: pubmed
    family: B
    kind: pmid-direct
    pmids: ["39653370"]
    reason: >-
      Seed-oracle recovery: the MONAI Deploy canonical paper (Gupta et al.,
      JMIR AI 2024, DOI 10.2196/55833) is PubMed-indexed but unreachable via
      query windows (tiab lacks the tool name; vocabulary arm matches 20,929
      records; date-descending 1,000-cap window is 2026-dominated).
  - query_id: G-PUB-002-r
    database: pubmed
    family: G
    kind: relevance-sorted-refetch
    blocks_source: executed_families.G.queries.pubmed.blocks
    reason: >-
      Retention probe: family-G PubMed window under default Entrez ordering
      is 2026-dominated (995/1000 rows from 2026); this one-shot refetch uses
      sort=relevance to test whether older v1-core records (26/52 v1 studies
      missing from the v2 dedup) re-enter the window.

date_range:
  start: "2015-01-01"
  end: "EXECUTION_DATE" # substituted with the actual run date by the Task-3 fetcher
  application:
    pubmed: >-
      Entrez esearch mindate=2015/01/01 maxdate=<execution date> (datetype=pdat);
      query blocks carry no date clause.
    arxiv: >-
      API search_query conjunction with
      submittedDate:[201501010000 TO <execution date, YYYYMMDDHHMM>].
    semantic_scholar: >-
      Graph API paper/search year filter (2015-<execution year>) applied as a
      request parameter.
    google_scholar: >-
      NO query-level date filtering available — pre-2015 records possible;
      year eligibility enforced downstream at screening (documented limitation).

databases: [pubmed, arxiv, semantic_scholar, google_scholar]

rendering_notes:
  join_semantics: >-
    Each query is a list of AND-blocks; the executed query string is
    " AND ".join(blocks). Family B is a single top-level block.
  wildcard_expansion: >-
    PubMed keeps Entrez wildcards (radiolog*, tomograph*, reproducib*).
    arXiv, Semantic Scholar and Google Scholar lack wildcard support; their
    family-B blocks expand them to explicit word forms (radiology,
    radiological, radiologists; tomography, tomographic; reproducibility,
    reproducible).
  semantic_scholar_syntax: >-
    The Semantic Scholar Graph API relevance-search endpoint has no ti:/abs:
    fielded search; its query blocks keep the pinned boolean structure with
    quoted phrases and no field prefixes.
  google_scholar_syntax: >-
    Google Scholar ignores ti:/abs: fielded syntax; GS blocks are plain
    quoted phrases only.

