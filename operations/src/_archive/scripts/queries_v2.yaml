        (ti:"abdominal" OR abs:"abdominal" OR ti:"thoracic" OR abs:"thoracic" OR
        ti:"multi-organ" OR abs:"multi-organ" OR ti:"whole-body" OR abs:"whole-body" OR
        ti:"liver" OR abs:"liver" OR ti:"kidney" OR abs:"kidney" OR ti:"spleen" OR
        abs:"spleen" OR ti:"pancreas" OR abs:"pancreas" OR ti:"lung" OR abs:"lung" OR
        ti:"vessel" OR abs:"vessel" OR ti:"vascular" OR abs:"vascular" OR
