        liver[tiab] OR kidney[tiab] OR spleen[tiab] OR pancreas[tiab] OR lung[tiab] OR
        vessel[tiab] OR vascular[tiab] OR tubular[tiab] OR "computed tomography"[tiab] OR
        "CT"[tiab])
